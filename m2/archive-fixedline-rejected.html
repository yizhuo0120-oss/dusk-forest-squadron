<style>

    position: fixed; top: 12px; left: 14px; z-index: 10;

<script>
  window.addEventListener("error", function (ev) {
    var m = document.getElementById("bootMsg");
    if (m) { m.style.color = "#ff5d5d"; m.textContent = "脚本错误: " + ((ev.error && ev.error.message) || ev.message || ev.type); }
  });
  window.addEventListener("unhandledrejection", function (ev) {
    var m = document.getElementById("bootMsg");
    if (m) { m.style.color = "#ff5d5d"; m.textContent = "异步错误: " + ((ev.reason && ev.reason.message) || ev.reason); }
  });
</script>

<div id="hud">
  <div>得分 <b id="score">0</b></div>
  <div>速度 <b id="spd">--</b></div>
  <div id="wstate">空仓挂机</div>
  <div id="lockTrack"><i id="lockFill"></i></div>
  <div id="tip">左手=驾驶（移动+倾斜+油门档） ｜ 右手移动=转动场景瞄准（黄色弹道线固定不动，扫到敌人会高亮） ｜ 张掌=保险 ｜ 握拳=机枪 ｜ 手枪=火箭弹 ｜ 比耶=导弹锁定1.5s ｜ 爱你=大招</div>
</div>
<canvas id="pip"></canvas>
<div id="flash"></div>

<div id="boot">
  <h2>M2 · 固定弹道线 · 手势飞行射击</h2>
  <p>
    黄色弹道线固定在屏幕上（从机身射向屏幕深处）——右手上下左右移动 = 转动场景瞄准<br>
    弹道线扫到敌人时敌人会高亮，此时开火即命中<br>
    左手=驾驶：掌心移动（大空间）+ 倾斜（滚转表现）+ 开合=油门档位（拳=0停）<br>
    握拳=机枪 · 手枪=火箭弹 · 比耶=导弹锁定1.5s · 爱你=大招 · 右手首次入画自动校准
  </p>
  <button id="startBtn">开启摄像头</button>
  <div id="bootMsg"></div>
</div>

<script type="module">
const LIB_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task";

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
];
const SMOOTH = 0.25, DEBOUNCE_N = 2;
const $ = id => document.getElementById(id);

const state = {
  running: false,
  left:  { bankS: null, xS: null, yS: null, openS: null, buf: [], gest: "None" },
  right: { buf: [], gest: "None", gun: false, seenT: 0, dx: 0, dy: 0 },
  rcal: { done: false, cx: 0, cy: 0, sumX: 0, sumY: 0, n: 0 },
  frameHands: [], handCountNow: 0, lastVideoTime: -1, lastHandT: 0
};

// ===== 双手身份跟踪（M1 已验证方案）=====
const track = { slots: { left: null, right: null } };
const HOLD_MS = 250, MATCH_DIST = 0.30;

function isGunPose(lm) {
  const scale = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) || 1e-6;
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const idxExt = d(8, 0) / scale, midExt = d(12, 0) / scale;
  return idxExt > 1.1 && midExt < idxExt * 0.75 &&
    d(12, 9) / scale < 0.9 && d(16, 13) / scale < 0.9 && d(20, 17) / scale < 0.9;
}

function associate(res, now) {
  const hands = res.handedness || res.handednesses || [];
  const dets = [];
  for (let i = 0; i < hands.length; i++) {
    const lm = res.landmarks[i];
    if (!lm) continue;
    const reported = hands[i]?.[0]?.categoryName;
    const reportedLabel = reported === "Left" ? "Right" : reported === "Right" ? "Left" : reported; // 实测需翻转
    const g = res.gestures?.[i]?.[0];
    dets.push({ lm, reportedLabel, x: lm[0].x, y: lm[0].y, gest: g ? g.categoryName : "None", gun: isGunPose(lm) });
  }
  state.handCountNow = dets.length;
  const result = [], used = new Set(), cand = [];
  for (const side of ["left", "right"]) {
    const s = track.slots[side];
    if (!s) continue;
    if (now - s.lastT > HOLD_MS) { track.slots[side] = null; continue; }
    dets.forEach((d, di) => {
      if (!used.has(di)) {
        const dist = Math.hypot(d.x - s.x, d.y - s.y);
        if (dist < MATCH_DIST) cand.push({ side, di, dist });
      }
    });
  }
  cand.sort((a, b) => a.dist - b.dist);
  for (const c of cand) {
    if (used.has(c.di) || !track.slots[c.side]) continue;
    used.add(c.di);
    const d = dets[c.di];
    track.slots[c.side] = { x: d.x, y: d.y, lastT: now };
    result.push({ label: c.side === "left" ? "Left" : "Right", lm: d.lm, gest: d.gest, gun: d.gun });
  }
  for (let di = 0; di < dets.length; di++) {
    if (used.has(di)) continue;
    const d = dets[di];
    let side = d.x < 0.42 ? "left" : d.x > 0.58 ? "right" : d.reportedLabel;
    if (result.some(r => r.label === (side === "left" ? "Left" : "Right"))) {
      const other = side === "left" ? "Right" : "Left";
      if (!result.some(r => r.label === other)) side = other === "Right" ? "right" : "left";
    }
    track.slots[side] = { x: d.x, y: d.y, lastT: now };
    result.push({ label: side === "left" ? "Left" : "Right", lm: d.lm, gest: d.gest, gun: d.gun });
  }
  return result;
}

function process(res, now) {
  state.frameHands = associate(res, now);
  for (const { label, lm, gest, gun } of state.frameHands) {
    const slot = label === "Left" ? state.left : state.right;
    slot.buf.push(gest);
    if (slot.buf.length > DEBOUNCE_N) slot.buf.shift();
    if (slot.buf.length === DEBOUNCE_N && slot.buf.every(x => x === slot.buf[0]) && slot.buf[0] !== slot.gest) {
      slot.gest = slot.buf[0];
    }
    if (label === "Left") {
      const p5 = lm[5], p17 = lm[17];
      let deg = Math.atan2(p5.y - p17.y, p5.x - p17.x) * 180 / Math.PI;
      if (deg > 90) deg -= 180;
      if (deg < -90) deg += 180;
      state.left.bankS = state.left.bankS === null ? deg : state.left.bankS + (deg - state.left.bankS) * SMOOTH;
      const x = lm[9].x, y = lm[9].y;
      state.left.xS = state.left.xS === null ? x : state.left.xS + (x - state.left.xS) * SMOOTH;
      state.left.yS = state.left.yS === null ? y : state.left.yS + (y - state.left.yS) * SMOOTH;
      // 油门开合度：四指尖到腕距离 ÷ 手掌尺度（全开≈1.9，握拳≈1.0）
      const dW = j => Math.hypot(lm[j].x - lm[0].x, lm[j].y - lm[0].y);
      const scale = Math.hypot(lm[9].x - lm[0].x, lm[9].y - lm[0].y) || 1e-6;
      const open = (dW(8) + dW(12) + dW(16) + dW(20)) / (4 * scale);
      state.left.openS = state.left.openS === null ? open : state.left.openS + (open - state.left.openS) * 0.25;
    } else {
      state.right.gun = gun;
      state.right.seenT = now;
      // 右手掌心：自动校准中心（前15帧）后取偏移 → 转动场景瞄准
      const rx = lm[9].x, ry = lm[9].y;
      const C = state.rcal;
      if (!C.done) {
        C.sumX += rx; C.sumY += ry; C.n++;
        if (C.n >= 15) { C.cx = C.sumX / C.n; C.cy = C.sumY / C.n; C.done = true; }
      } else {
        const dx = rx - C.cx, dy = ry - C.cy;
        state.right.dx += (dx - state.right.dx) * SMOOTH;
        state.right.dy += (dy - state.right.dy) * SMOOTH;
      }
    }
  }
  if (state.frameHands.length > 0) state.lastHandT = now;
  const hasR = state.frameHands.some(h => h.label === "Right");
  if (!hasR && now - state.right.seenT > 2000 && state.rcal.done) {
    state.rcal.done = false; state.rcal.n = 0; state.rcal.sumX = 0; state.rcal.sumY = 0;
  }
}

// ===== Three.js：固定弹道线 + 世界随双手转动 =====
const THREE = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x14283f, 100, 190);
const camera3 = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
camera3.position.set(0, 1.5, 8);
camera3.lookAt(0, 0, -20);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.className = "game";
document.body.prepend(renderer.domElement);
addEventListener("resize", () => {
  camera3.aspect = innerWidth / innerHeight;
  camera3.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 世界组：场景随左手驾驶平移、随右手瞄准转动
const world = new THREE.Group();
scene.add(world);

// ===== 环境 =====
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x05080f) },
      mid: { value: new THREE.Color(0x14283f) },
      bot: { value: new THREE.Color(0x2a4a6a) }
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;
      void main(){
        float h = normalize(vP).y;
        vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.7)) : mix(mid, bot, pow(-h, 0.5));
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
world.add(sky);
const grid = new THREE.GridHelper(400, 40, 0x3a6a9a, 0x1d3a52);
grid.material.transparent = true;
grid.material.opacity = 0.55;
grid.position.set(0, -5.2, -60);
world.add(grid);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(4000, 4000).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x0a1420 })
);
ground.position.set(0, -5.3, -60);
world.add(ground);
const starPos = new Float32Array(400 * 3);
for (let i = 0; i < 400; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 80;
  starPos[i * 3 + 1] = Math.random() * 45 - 2;
  starPos[i * 3 + 2] = -Math.random() * 160 + 10;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
world.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x8fa3bd, size: 0.5 })));

// 视觉飞机：固定在屏幕左下角（锚点，永不旋转）
const planeView = new THREE.Group();
{
  const body = new THREE.Mesh(
    new THREE.ConeGeometry(0.55, 1.8, 4).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x35e0ff })
  );
  planeView.add(body);
  const trimMat = new THREE.MeshBasicMaterial({ color: 0xe8f4ff });
  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.55, 0.5), trimMat);
  fin.position.set(0, 0.28, 0.65);
  planeView.add(fin);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.07, 0.55), trimMat);
  wing.position.set(0, -0.05, 0.35);
  planeView.add(wing);
}
scene.add(planeView);

// 固定弹道线：从机身射向屏幕中心方向（场景级，随视差更新但屏幕位置恒定）
const trajGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const traj = new THREE.Line(trajGeo, new THREE.LineDashedMaterial({
  color: 0xffe066, dashSize: 1.2, gapSize: 0.7, transparent: true, opacity: 0.75
}));
scene.add(traj);

// 逻辑状态：飞机世界位置（左手驾驶）+ 瞄准偏移（右手）
const planePos = new THREE.Vector3(0, 0.5, 0);
const AIM_DEPTH = 70;        // 瞄点深度 = 靶机层
const aimPan = new THREE.Vector3(0, 0, 0);   // 右手微调 → 瞄点偏移（逻辑）

const enemyGeo = new THREE.OctahedronGeometry(0.75);
const enemyMat = new THREE.MeshBasicMaterial({ color: 0xff4444 });
const enemyHlMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
const enemyWireGeo = new THREE.OctahedronGeometry(1.0);
const enemyWireMat = new THREE.MeshBasicMaterial({ color: 0xffaaaa, wireframe: true, transparent: true, opacity: 0.35 });
const bulletGeo = new THREE.SphereGeometry(0.12, 6, 6);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
const rocketGeo = new THREE.ConeGeometry(0.28, 1.1, 6).rotateX(-Math.PI / 2);
const rocketMat = new THREE.MeshBasicMaterial({ color: 0xff8c00 });
const missileGeo = new THREE.SphereGeometry(0.3, 8, 8);
const missileMat = new THREE.MeshBasicMaterial({ color: 0xff4fd8 });
const reticle = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1.5, 1.5, 1.5)),
  new THREE.LineBasicMaterial({ color: 0xff4fd8 })
);
reticle.visible = false;
world.add(reticle);

const enemies = [], bullets = [], rockets = [], missiles = [], deaths = [];
let score = 0, nextSpawn = 0;

// 逻辑瞄点（世界坐标）
function aimPoint() {
  return new THREE.Vector3(planePos.x + aimPan.x, planePos.y + aimPan.y, planePos.z - AIM_DEPTH);
}

function spawnEnemy() {
  const m = new THREE.Mesh(enemyGeo, enemyMat);
  m.add(new THREE.Mesh(enemyWireGeo, enemyWireMat));
  m.position.set((Math.random() - 0.5) * 18, (Math.random() - 0.5) * 7, -70);
  world.add(m); enemies.push(m);
}
function killEnemy(m, pts) {
  world.remove(m);
  enemies.splice(enemies.indexOf(m), 1);
  deaths.push({ m, t: 0 });
  score += pts;
  $("score").textContent = score;
}

// ===== 武器 =====
const weapons = { mgNext: 0, rocketHeld: false, ultHeld: false, ultLast: -9999, chargeStart: null, firedAt: null, chargeTarget: null };
const MISSILE_CHARGE_MS = 1500;

function fireMG() {
  const b = new THREE.Mesh(bulletGeo, bulletMat);
  const aim = aimPoint();
  // 出膛点向瞄准线靠拢 40%：弹道尽快贴上弹道线
  const muzzle = new THREE.Vector3(
    planePos.x + (aim.x - planePos.x) * 0.4,
    planePos.y + (aim.y - planePos.y) * 0.4,
    planePos.z - 1.2
  );
  b.position.copy(muzzle);
  b.userData.dir = aim.sub(muzzle).normalize();
  world.add(b); bullets.push(b);
}
function fireRocket() {
  const r = new THREE.Mesh(rocketGeo, rocketMat);
  const aim = aimPoint();
  const muzzle = new THREE.Vector3(
    planePos.x + (aim.x - planePos.x) * 0.4,
    planePos.y + (aim.y - planePos.y) * 0.4,
    planePos.z - 1.5
  );
  r.position.copy(muzzle);
  r.userData.dir = aim.sub(muzzle).normalize();
  r.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), r.userData.dir);
  world.add(r); rockets.push(r);
}
function launchMissile(target) {
  const m = new THREE.Mesh(missileGeo, missileMat);
  const muzzle = planePos.clone(); muzzle.z -= 1.5;
  m.position.copy(muzzle);
  m.userData.dir = aimPoint().sub(muzzle).normalize();
  m.userData.target = target || null;
  if (!m.userData.target) {
    let best = null, bd = 1e9;
    for (const e of enemies) {
      const d = e.position.distanceTo(aimPoint());
      if (d < bd) { bd = d; best = e; }
    }
    m.userData.target = best;
  }
  world.add(m); missiles.push(m);
}
function doUlt() {
  $("flash").style.transition = "none";
  $("flash").style.opacity = "0.85";
  requestAnimationFrame(() => { $("flash").style.transition = "opacity .5s"; $("flash").style.opacity = "0"; });
  for (const e of [...enemies]) killEnemy(e, 1);
}

// ===== 启动 =====
const video = document.createElement("video");
video.setAttribute("playsinline", ""); video.muted = true;
const pip = $("pip"), pctx = pip.getContext("2d");
const det = document.createElement("canvas");
const dctx = det.getContext("2d");
let recognizer = null;

$("startBtn").addEventListener("click", start);

async function start() {
  const btn = $("startBtn"), msg = $("bootMsg");
  btn.disabled = true;
  try {
    msg.style.color = "";
    msg.textContent = "① 加载识别库与 3D 库…";
    const lib = await import(LIB_URL);
    msg.textContent = "② 请求摄像头权限…";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    msg.textContent = "③ 加载手势模型（约 8MB）…";
    const vision = await lib.FilesetResolver.forVisionTasks(WASM_URL);
    try {
      recognizer = await lib.GestureRecognizer.createFromOptions(vision, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" }, runningMode: "VIDEO", numHands: 2
      });
    } catch (e) {
      recognizer = await lib.GestureRecognizer.createFromOptions(vision, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" }, runningMode: "VIDEO", numHands: 2
      });
    }
    pip.width = video.videoWidth; pip.height = video.videoHeight;
    det.width = 640; det.height = Math.round(640 * video.videoHeight / video.videoWidth);
    for (let i = 0; i < 4; i++) spawnEnemy();
    $("boot").style.display = "none";
    state.running = true;
    state.lastHandT = performance.now();
  } catch (err) {
    msg.textContent = "";
    $("bootMsg").style.color = "#ff5d5d";
    $("bootMsg").textContent = err.name === "NotAllowedError"
      ? "摄像头权限被拒绝 — 地址栏允许后刷新"
      : err.name === "NotReadableError"
        ? "摄像头被占用 — 关掉其他使用摄像头的页面再刷新"
        : "启动失败: " + err.message;
    btn.disabled = false;
  }
}

// ===== 主循环 =====
let lastT = 0;
const DEAD = 0.12;

function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;

  // 视觉步骤
  if (state.running && video.currentTime !== state.lastVideoTime) {
    state.lastVideoTime = video.currentTime;
    const w = pip.width, h = pip.height;
    pctx.save(); pctx.translate(w, 0); pctx.scale(-1, 1); pctx.drawImage(video, 0, 0, w, h); pctx.restore();
    dctx.save(); dctx.translate(det.width, 0); dctx.scale(-1, 1); dctx.drawImage(video, 0, 0, det.width, det.height); dctx.restore();
    const res = recognizer.recognizeForVideo(det, t);
    process(res, t);
    drawSkeleton();
  }

  const R = state.right, L = state.left;

  // ===== 驾驶：左手移动 planePos，倾斜=滚转表现 =====
  let throttle = 1;
  if (L.openS !== null) throttle = THREE.MathUtils.clamp((L.openS - 1.1) / (1.9 - 1.1) * 5, 0, 5) / 5;
  const gear = Math.round(throttle * 5);
  $("spd").textContent = gear + " 档 (" + Math.round(throttle * 100) + "%)";

  if (L.xS !== null) {
    let targetX = (L.xS - 0.5) * 20;
    if (L.bankS !== null) targetX += (L.bankS / 60) * 4;
    targetX = THREE.MathUtils.clamp(targetX, -12, 12);
    planePos.x += (targetX - planePos.x) * 0.25;
  }
  if (L.yS !== null) {
    const targetY = (0.5 - L.yS) * 9;
    planePos.y += (targetY - planePos.y) * 0.25;
  }
  if (L.bankS !== null) planeView.rotation.z = THREE.MathUtils.degToRad(-L.bankS);

  // ===== 瞄准：右手偏移 → 瞄点偏移（逻辑）=====
  if (state.rcal.done) {
    const dzf = v => Math.abs(v) < 0.12 ? 0 : v - Math.sign(v) * 0.12;
    const fdx = THREE.MathUtils.clamp(dzf(state.right.dx / 0.145), -1, 1);
    const fdy = THREE.MathUtils.clamp(dzf(-state.right.dy / 0.145), -1, 1);
    aimPan.x += (fdx * 9 - aimPan.x) * 0.3;
    aimPan.y += (fdy * 9 - aimPan.y) * 0.3;
  }

  // ===== 世界变换：弹道线固定屏幕上，瞄点永远落在弹道线上（场景随瞄准转动）=====
  {
    const aimPoint = new THREE.Vector3(planePos.x + aimPan.x, planePos.y + aimPan.y, planePos.z - AIM_DEPTH);
    const centerDir = new THREE.Vector3(0, -0.02, -1).normalize();
    const D = new THREE.Vector3(-3.4, -0.7, -6.6).applyMatrix4(camera3.matrixWorld);
    planeView.position.copy(D);
    const toAim = aimPoint.clone().sub(camera3.position);
    const C = camera3.position.clone().addScaledVector(centerDir, toAim.length());
    const v = new THREE.Vector3(aimPan.x, aimPan.y, -AIM_DEPTH);
    const k = C.distanceTo(D) / v.length();
    const qTmp = new THREE.Quaternion().setFromUnitVectors(v.clone().normalize(), C.clone().sub(D).normalize());
    world.quaternion.copy(qTmp);
    world.scale.setScalar(k);
    world.position.copy(planePos).multiplyScalar(-k).applyQuaternion(qTmp).add(D);
  }

  // ===== 固定弹道线渲染（场景级：机身显示位 → 屏幕中心方向）=====
  {
    const centerDir = new THREE.Vector3(0, -0.02, -1).normalize();
    const start = planeView.position.clone().add(new THREE.Vector3(0, 0.1, -1.0));
    const end = camera3.position.clone().addScaledVector(centerDir, 60);
    const posAttr = trajGeo.attributes.position;
    posAttr.setXYZ(0, start.x, start.y, start.z);
    posAttr.setXYZ(1, end.x, end.y, end.z);
    posAttr.needsUpdate = true;
    traj.computeLineDistances();
  }

  // ===== 轨迹扫过靶机 → 高亮（逻辑瞄线 = 机身 → 瞄点）=====
  {
    const aimP = aimPoint();
    const origin = planePos;
    const ab = aimP.clone().sub(origin);
    const abLenSq = Math.max(ab.lengthSq(), 1e-6);
    for (const e of enemies) {
      const tt = THREE.MathUtils.clamp(e.position.clone().sub(origin).dot(ab) / abLenSq, 0, 1);
      const d = e.position.distanceTo(origin.clone().addScaledVector(ab, tt));
      const on = d < 1.4;
      if (e.userData.hl !== on) {
        e.userData.hl = on;
        e.material = on ? enemyHlMat : enemyMat;
      }
    }
  }

  // ===== 武器逻辑 =====
  const rocketNow = state.running && (R.gest === "Pointing_Up" || R.gun);
  const fistNow = state.running && R.gest === "Closed_Fist";
  const ultNow = state.running && R.gest === "ILoveYou";
  const missileNow = state.running && R.gest === "Victory";

  if (rocketNow && !weapons.rocketHeld) fireRocket();
  weapons.rocketHeld = rocketNow;
  if (fistNow) {
    if (t >= weapons.mgNext) { fireMG(); weapons.mgNext = t + 110; }
  } else weapons.mgNext = 0;
  if (ultNow && !weapons.ultHeld && t - weapons.ultLast > 5000) { doUlt(); weapons.ultLast = t; }
  weapons.ultHeld = ultNow;

  let lockPct = 0;
  const lockOn = missileNow && performance.now() - R.seenT < 300;
  const ap = aimPoint();
  if (lockOn) {
    if (weapons.chargeTarget && !enemies.includes(weapons.chargeTarget)) {
      weapons.chargeStart = null;
      weapons.chargeTarget = null;
    }
    if (weapons.chargeStart == null) weapons.chargeStart = t;
    if (!weapons.chargeTarget && enemies.length) {
      // 锁定离瞄点最近的靶机（弹道线压谁就锁谁）
      let best = null, bd = 1e9;
      for (const e of enemies) {
        const d = e.position.distanceTo(ap);
        if (d < bd) { bd = d; best = e; }
      }
      weapons.chargeTarget = best;
    }
    reticle.visible = !!weapons.chargeTarget;
    if (weapons.chargeTarget) reticle.position.copy(weapons.chargeTarget.position);
    const held = t - weapons.chargeStart;
    if (held >= MISSILE_CHARGE_MS) {
      if (!weapons.firedAt) { weapons.firedAt = t; launchMissile(weapons.chargeTarget); }
      lockPct = 100;
    } else lockPct = held / MISSILE_CHARGE_MS * 100;
  } else {
    weapons.chargeStart = null; weapons.chargeTarget = null; weapons.firedAt = null;
    reticle.visible = false;
  }
  $("lockTrack").style.display = lockOn ? "block" : "none";
  $("lockFill").style.width = lockPct + "%";

  const ws = $("wstate");
  if (ultNow) { ws.textContent = "💥 大招！"; ws.className = "fire"; }
  else if (lockOn) { ws.textContent = lockPct >= 100 ? "💥 导弹已发射！" : "🎯 导弹锁定中 " + ((t - weapons.chargeStart) / 1000).toFixed(1) + "s / 1.5s"; ws.className = "fire"; }
  else if (rocketNow) { ws.textContent = "🚀 火箭弹"; ws.className = "fire"; }
  else if (fistNow) { ws.textContent = "🔫 机枪开火中"; ws.className = "fire"; }
  else { ws.textContent = "空仓挂机"; ws.className = ""; }

  // ===== 实体更新 =====
  if (state.running && t > nextSpawn && enemies.length < 6) { spawnEnemy(); nextSpawn = t + 1200; }
  for (const e of [...enemies]) {
    e.rotation.x += dt; e.rotation.y += dt * 0.7;
    if (e.position.distanceTo(planePos) > 200) {
      world.remove(e); enemies.splice(enemies.indexOf(e), 1);
    }
  }
  for (const b of [...bullets]) {
    b.position.addScaledVector(b.userData.dir, 90 * dt);
    if (b.position.distanceTo(planePos) > 150) { world.remove(b); bullets.splice(bullets.indexOf(b), 1); continue; }
    for (const e of [...enemies]) {
      if (b.position.distanceTo(e.position) < 0.95) {
        world.remove(b); bullets.splice(bullets.indexOf(b), 1);
        killEnemy(e, 1); break;
      }
    }
  }
  for (const r of [...rockets]) {
    r.position.addScaledVector(r.userData.dir, 60 * dt);
    if (r.position.distanceTo(planePos) > 150) { world.remove(r); rockets.splice(rockets.indexOf(r), 1); continue; }
    for (const e of [...enemies]) {
      if (r.position.distanceTo(e.position) < 1.4) {
        world.remove(r); rockets.splice(rockets.indexOf(r), 1);
        killEnemy(e, 2); break;
      }
    }
  }
  for (const m of [...missiles]) {
    const tg = m.userData.target;
    if (tg && enemies.includes(tg)) {
      m.userData.dir.copy(tg.position).sub(m.position).normalize();
    }
    m.position.addScaledVector(m.userData.dir, 26 * dt);
    if (m.position.distanceTo(planePos) > 150) { world.remove(m); missiles.splice(missiles.indexOf(m), 1); continue; }
    for (const e of [...enemies]) {
      if (m.position.distanceTo(e.position) < 1.3) {
        world.remove(m); missiles.splice(missiles.indexOf(m), 1);
        killEnemy(e, 3); break;
      }
    }
  }
  for (const d of [...deaths]) {
    d.t += dt;
    if (d.t > 0.15) { world.remove(d.m); deaths.splice(deaths.indexOf(d), 1); continue; }
    d.m.scale.setScalar(1 - d.t / 0.15);
  }

  renderer.render(scene, camera3);
}
requestAnimationFrame(loop);

function drawSkeleton() {
  const w = pip.width, h = pip.height;
  for (const { label, lm } of state.frameHands) {
    const color = label === "Left" ? "#35e0ff" : "#ff9f43";
    const P = j => ({ x: lm[j].x * w, y: lm[j].y * h });
    const p5 = P(5), p17 = P(17);
    pctx.strokeStyle = "rgba(255,255,255,.85)"; pctx.lineWidth = 3.5;
    pctx.beginPath(); pctx.moveTo(p5.x, p5.y); pctx.lineTo(p17.x, p17.y); pctx.stroke();
    pctx.strokeStyle = color; pctx.lineWidth = 2;
    pctx.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) { const pa = P(a), pb = P(b); pctx.moveTo(pa.x, pa.y); pctx.lineTo(pb.x, pb.y); }
    pctx.stroke();
    pctx.fillStyle = color;
    for (let j = 0; j < lm.length; j++) { const p = P(j); pctx.beginPath(); pctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); pctx.fill(); }
    const w0 = P(0);
    pctx.font = "bold 16px Consolas";
    pctx.fillText(label === "Left" ? "左手" : "右手", w0.x - 18, w0.y + 28);
  }
}
</script>
