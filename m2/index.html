<script type="module">
const LIB_URL = "./vendor/vision_bundle.mjs";   // 本地打包：不依赖境外 CDN
const WASM_URL = "./vendor/wasm";
const MODEL_URL = "./vendor/gesture_recognizer.task";

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
];
const SMOOTH = 0.25, DEBOUNCE_N = 2;
const $ = id => document.getElementById(id);

const state = {
  running: false,
  left:  { bankS: null, xS: null, yS: null, openS: null, buf: [], gest: "None" },
  right: { buf: [], gest: "None", gun: false, seenT: 0, dx: 0, dy: 0 },
  rcal: { done: false, cx: 0, cy: 0, sumX: 0, sumY: 0, n: 0 },
  frameHands: [], handCountNow: 0, lastVideoTime: -1, lastHandT: 0
};

// ===== 关卡设计 =====
const LEVELS = [
  { name: "萤火谷", en: "FIREFLY VALLEY", sub: "暮色渐沉，萤火为灯", quota: 8,  spawnMs: 1400, types: ["basic"],                 speed: 1.0 },
  { name: "双星潮", en: "TWIN TIDE",      sub: "双流交叉，追星逐月", quota: 10, spawnMs: 1150, types: ["basic", "zigzag"],        speed: 1.15 },
  { name: "雾林哨戒", en: "MIST WARDEN",  sub: "雾锁林深，甲光如铁", quota: 10, spawnMs: 1500, types: ["shield", "basic"],        speed: 0.95 },
  { name: "失速风暴", en: "STALL STORM",  sub: "湍流骤起，勿失其速", quota: 12, spawnMs: 950,  types: ["zigzag", "pulse"],        speed: 1.3 },
  { name: "灯火山口", en: "LANTERN CRATER", sub: "血月当空，巨像临世", quota: 1, spawnMs: 1700, types: ["boss", "basic"],          speed: 0.9 }
];
const LAYER_ZH = ["第一关", "第二关", "第三关", "第四关", "第五关"];

// 敌人类型：血量 / 体型 / 颜色 / 分值 / 行为
const ENEMY_TYPES = {
  basic:  { hp: 1,  size: 0.8,  color: 0xff9a8a, pts: 2,  speed: 1.0 },
  zigzag: { hp: 1,  size: 0.65, color: 0xffe08a, pts: 3,  speed: 1.15, zig: 4.5 },
  shield: { hp: 2,  size: 0.85, color: 0xffa0c8, pts: 4,  speed: 0.8,  shield: true },
  pulse:  { hp: 1,  size: 0.7,  color: 0x9fe8ff, pts: 3,  speed: 1.0,  pulse: true },
  boss:   { hp: 20, size: 2.0,  color: 0xff7a9a, pts: 25, speed: 0.45, boss: true }
};

// ===== 双手身份跟踪（M1 已验证方案）=====
const track = { slots: { left: null, right: null } };
const HOLD_MS = 250, MATCH_DIST = 0.30;

function isGunPose(lm) {
  const scale = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) || 1e-6;
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const idxExt = d(8, 0) / scale, midExt = d(12, 0) / scale;
  return idxExt > 1.1 && midExt < idxExt * 0.75 &&
    d(12, 9) / scale < 0.9 && d(16, 13) / scale < 0.9 && d(20, 17) / scale < 0.9;
}

function associate(res, now) {
  const hands = res.handedness || res.handednesses || [];
  const dets = [];
  for (let i = 0; i < hands.length; i++) {
    const lm = res.landmarks[i];
    if (!lm) continue;
    const reported = hands[i]?.[0]?.categoryName;
    const reportedLabel = reported === "Left" ? "Right" : reported === "Right" ? "Left" : reported;
    const g = res.gestures?.[i]?.[0];
    dets.push({ lm, reportedLabel, x: lm[0].x, y: lm[0].y, gest: g ? g.categoryName : "None", gun: isGunPose(lm) });
  }
  state.handCountNow = dets.length;
  const result = [], used = new Set(), cand = [];
  for (const side of ["left", "right"]) {
    const s = track.slots[side];
    if (!s) continue;
    if (now - s.lastT > HOLD_MS) { track.slots[side] = null; continue; }
    dets.forEach((d, di) => {
      if (!used.has(di)) {
        const dist = Math.hypot(d.x - s.x, d.y - s.y);
        if (dist < MATCH_DIST) cand.push({ side, di, dist });
      }
    });
  }
  cand.sort((a, b) => a.dist - b.dist);
  for (const c of cand) {
    if (used.has(c.di) || !track.slots[c.side]) continue;
    used.add(c.di);
    const d = dets[c.di];
    track.slots[c.side] = { x: d.x, y: d.y, lastT: now };
    result.push({ label: c.side === "left" ? "Left" : "Right", lm: d.lm, gest: d.gest, gun: d.gun });
  }
  for (let di = 0; di < dets.length; di++) {
    if (used.has(di)) continue;
    const d = dets[di];
    let side = d.x < 0.42 ? "left" : d.x > 0.58 ? "right" : d.reportedLabel;
    if (result.some(r => r.label === (side === "left" ? "Left" : "Right"))) {
      const other = side === "left" ? "Right" : "Left";
      if (!result.some(r => r.label === other)) side = other === "Right" ? "right" : "left";
    }
    track.slots[side] = { x: d.x, y: d.y, lastT: now };
    result.push({ label: side === "left" ? "Left" : "Right", lm: d.lm, gest: d.gest, gun: d.gun });
  }
  return result;
}

function process(res, now) {
  state.frameHands = associate(res, now);
  for (const { label, lm, gest, gun } of state.frameHands) {
    const slot = label === "Left" ? state.left : state.right;
    slot.buf.push(gest);
    if (slot.buf.length > DEBOUNCE_N) slot.buf.shift();
    if (slot.buf.length === DEBOUNCE_N && slot.buf.every(x => x === slot.buf[0]) && slot.buf[0] !== slot.gest) {
      slot.gest = slot.buf[0];
    }
    if (label === "Left") {
      const p5 = lm[5], p17 = lm[17];
      let deg = Math.atan2(p5.y - p17.y, p5.x - p17.x) * 180 / Math.PI;
      if (deg > 90) deg -= 180;
      if (deg < -90) deg += 180;
      state.left.bankS = state.left.bankS === null ? deg : state.left.bankS + (deg - state.left.bankS) * SMOOTH;
      const x = lm[9].x, y = lm[9].y;
      state.left.xS = state.left.xS === null ? x : state.left.xS + (x - state.left.xS) * SMOOTH;
      state.left.yS = state.left.yS === null ? y : state.left.yS + (y - state.left.yS) * SMOOTH;
      const dW = j => Math.hypot(lm[j].x - lm[0].x, lm[j].y - lm[0].y);
      const scale = Math.hypot(lm[9].x - lm[0].x, lm[9].y - lm[0].y) || 1e-6;
      const open = (dW(8) + dW(12) + dW(16) + dW(20)) / (4 * scale);
      state.left.openS = state.left.openS === null ? open : state.left.openS + (open - state.left.openS) * 0.25;
    } else {
      state.right.gun = gun;
      state.right.seenT = now;
      const rx = lm[9].x, ry = lm[9].y;
      const C = state.rcal;
      if (!C.done) {
        C.sumX += rx; C.sumY += ry; C.n++;
        if (C.n >= 15) { C.cx = C.sumX / C.n; C.cy = C.sumY / C.n; C.done = true; }
      } else {
        const dx = rx - C.cx, dy = ry - C.cy;
        state.right.dx += (dx - state.right.dx) * SMOOTH;
        state.right.dy += (dy - state.right.dy) * SMOOTH;
      }
    }
  }
  if (state.frameHands.length > 0) state.lastHandT = now;
  const hasR = state.frameHands.some(h => h.label === "Right");
  if (!hasR && now - state.right.seenT > 2000 && state.rcal.done) {
    state.rcal.done = false; state.rcal.n = 0; state.rcal.sumX = 0; state.rcal.sumY = 0;
  }
}

// ===== Three.js：暮色森林场景 =====
const THREE = await import("three");
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const dzf = v => Math.abs(v) < 0.12 ? 0 : v - Math.sign(v) * 0.12;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8ecf8, 160, 380);   // 明亮远景雾，拉深空间   // 暖灰雾：与参考图的林雾同调
const camera3 = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
camera3.position.set(0, 13.5, 8);
camera3.lookAt(0, 17.5, -20);   // 抬高视线：地平线压低，地面显远
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.className = "game";
document.body.prepend(renderer.domElement);
addEventListener("resize", () => {
  camera3.aspect = innerWidth / innerHeight;
  camera3.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 发光纹理（萤火虫 / 曳光 / 灯笼共用）
const glowTex = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  grd.addColorStop(0, "rgba(255,255,225,1)");
  grd.addColorStop(0.35, "rgba(255,205,95,0.9)");
  grd.addColorStop(1, "rgba(255,140,0,0)");
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

// ===== 天空：光遇式高饱和蓝天（天顶亮蓝 → 地平线浅青白）=====
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x3f9fe8) },
      mid: { value: new THREE.Color(0x9fd4f8) },
      bot: { value: new THREE.Color(0xe8f4ff) }
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;
      void main(){
        float h = normalize(vP).y;
        vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.75)) : mix(mid, bot, pow(-h, 0.45));
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);

// ===== 浮空岛（程序化 3D 建模：多面体岩体 + 岩瓣 + 草毯 + 树木 + 遗迹，几何合并优化）=====
const islandLightDir = new THREE.Vector3(-0.45, 0.78, 0.42).normalize();
const rockDark = new THREE.Color(0x172138), rockLight = new THREE.Color(0x4a6595);
const grassDark = new THREE.Color(0x2f7c3c), grassLight = new THREE.Color(0x7ed660);
const treeDark = new THREE.Color(0x2d7a3e), treeLight = new THREE.Color(0x8ade66);
const trunkDark = new THREE.Color(0x2f3a2a), trunkLight = new THREE.Color(0x5a6842);
const ruinDark = new THREE.Color(0x22304e), ruinLight = new THREE.Color(0x46587a);
const islandMat = new THREE.MeshBasicMaterial({ vertexColors: true });

function shadeFaces(geo, cDark, cLight, lightDir) {
  geo = geo.toNonIndexed();
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), n = new THREE.Vector3();
  const col = new THREE.Color();
  for (let f = 0; f < pos.count; f += 3) {
    A.fromBufferAttribute(pos, f); B.fromBufferAttribute(pos, f + 1); C.fromBufferAttribute(pos, f + 2);
    ab.subVectors(B, A); ac.subVectors(C, A); n.crossVectors(ab, ac).normalize();
    const lum2 = Math.max(0, n.dot(lightDir));
    col.copy(cDark).lerp(cLight, 0.3 + lum2 * 0.6);
    for (let k = 0; k < 3; k++) {
      colors[(f + k) * 3] = col.r; colors[(f + k) * 3 + 1] = col.g; colors[(f + k) * 3 + 2] = col.b;
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geo;
}

// 手动合并带顶点色的几何体（每岛合成一个网格，draw call 大幅下降）
function mergeColored(parts) {
  const prepared = [];
  let total = 0;
  for (const part of parts) {
    let g = part.geo.index ? part.geo.toNonIndexed() : part.geo;
    g.applyMatrix4(part.matrix);
    total += g.attributes.position.count;
    prepared.push(g);
  }
  const pos = new Float32Array(total * 3);
  const col = new Float32Array(total * 3);
  let off = 0;
  for (const g of prepared) {
    pos.set(g.attributes.position.array, off * 3);
    if (g.attributes.color) col.set(g.attributes.color.array, off * 3);
    off += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return out;
}

const islands = [];
function buildIsland(S) {
  const parts = [];
  const put = (geo, px, py, pz, ry, sy) => {
    const m = new THREE.Matrix4();
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry || 0, 0));
    m.compose(new THREE.Vector3(px, py, pz), q, new THREE.Vector3(1, sy || 1, 1));
    parts.push({ geo, matrix: m });
  };
  // ---- 主岩体：顶面压平台地，底部拉碎 ----
  {
    const rockGeo = new THREE.IcosahedronGeometry(S, 1);
    const rp = rockGeo.attributes.position;
    for (let i = 0; i < rp.count; i++) {
      let x = rp.getX(i), y = rp.getY(i), z = rp.getZ(i);
      const nz = Math.sin(x * 1.9 + z * 1.4) * 0.5 + Math.cos(y * 2.1 + x * 1.1) * 0.5;
      const ny = y > 0 ? Math.min(y * 0.52, S * 0.3) + nz * S * 0.04 : y * 1.3 + nz * S * 0.14;
      const kk = 1 + nz * 0.13;
      rp.setXYZ(i, x * kk * 1.12, ny, z * kk * 1.12);
    }
    rockGeo.computeVertexNormals();
    put(shadeFaces(rockGeo, rockDark, rockLight, islandLightDir), 0, 0, 0);
  }
  // ---- 底部岩瓣 ----
  const lobeN = 2 + Math.floor(Math.random() * 3);
  for (let l = 0; l < lobeN; l++) {
    const ls = S * (0.28 + Math.random() * 0.3);
    const lg = new THREE.IcosahedronGeometry(ls, 0);
    const lp = lg.attributes.position;
    for (let i = 0; i < lp.count; i++) {
      const x = lp.getX(i), y = lp.getY(i), z = lp.getZ(i);
      const nz2 = Math.sin(x * 3.1 + z * 2.3) * 0.5 + Math.cos(y * 2.7 + x) * 0.5;
      lp.setXYZ(i, x * (1 + nz2 * 0.22), y * (1.25 + nz2 * 0.35), z * (1 + nz2 * 0.22));
    }
    lg.computeVertexNormals();
    const angL = (l / lobeN) * Math.PI * 2 + Math.random() * 0.7;
    put(shadeFaces(lg, rockDark, rockLight, islandLightDir),
      Math.cos(angL) * S * 0.5, -S * (0.24 + Math.random() * 0.2), Math.sin(angL) * S * 0.5, Math.random() * 3);
  }
  // ---- 草毯：外沿下垂 ----
  {
    const grassGeo = new THREE.SphereGeometry(S * 1.16, 20, 9, 0, Math.PI * 2, 0, Math.PI * 0.52);
    const gp = grassGeo.attributes.position;
    const gcols = new Float32Array(gp.count * 3);
    const gc = new THREE.Color();
    for (let i = 0; i < gp.count; i++) {
      const x = gp.getX(i), y = gp.getY(i), z = gp.getZ(i);
      const rim = Math.sqrt(x * x + z * z) / (S * 1.16);
      const nz3 = Math.sin(x * 2.2 + z * 1.7) * 0.04;
      gp.setXYZ(i, x * (1 + nz3), y * (0.17 + rim * 0.06) - rim * rim * S * 0.12, z * (1 + nz3));
      gc.copy(grassDark).lerp(grassLight, Math.pow(1 - rim * 0.92, 1.15));
      gcols[i * 3] = gc.r; gcols[i * 3 + 1] = gc.g; gcols[i * 3 + 2] = gc.b;
    }
    grassGeo.setAttribute('color', new THREE.BufferAttribute(gcols, 3));
    put(grassGeo, 0, S * 0.28, 0);
  }
  // ---- 树木：树干 + 两粒树冠 ----
  const treeN = S > 10 ? 2 : 1;
  for (let t2 = 0; t2 < treeN; t2++) {
    const trunkH = S * 0.26;
    const angT = Math.random() * Math.PI * 2, radT = Math.sqrt(Math.random()) * S * 0.45;
    const tx = Math.cos(angT) * radT, tz = Math.sin(angT) * radT, ty = S * 0.34;
    put(shadeFaces(new THREE.CylinderGeometry(S * 0.032, S * 0.05, trunkH, 5), trunkDark, trunkLight, islandLightDir), tx, ty + trunkH / 2, tz);
    for (let c2 = 0; c2 < 2; c2++) {
      const cs = S * (0.19 - c2 * 0.05);
      put(shadeFaces(new THREE.IcosahedronGeometry(cs, 1), treeDark, treeLight, islandLightDir),
        tx + (Math.random() - 0.5) * S * 0.08, ty + trunkH + c2 * cs * 0.6, tz + (Math.random() - 0.5) * S * 0.08,
        Math.random() * 3, 0.82);
    }
  }
  // ---- 遗迹：塔 + 顶盖 + 台阶（大岛）----
  if (S > 14) {
    const baseY = S * 0.34;
    const towerH = S * 0.5;
    const tx = (Math.random() - 0.5) * S * 0.3, tz = (Math.random() - 0.5) * S * 0.3;
    put(shadeFaces(new THREE.BoxGeometry(S * 0.19, towerH, S * 0.19), ruinDark, ruinLight, islandLightDir), tx, baseY + towerH / 2, tz);
    put(shadeFaces(new THREE.BoxGeometry(S * 0.26, S * 0.07, S * 0.26), ruinDark, ruinLight, islandLightDir), tx, baseY + towerH + S * 0.035, tz);
    for (let st2 = 0; st2 < 3; st2++) {
      put(shadeFaces(new THREE.BoxGeometry(S * 0.15, S * 0.028, S * 0.065), ruinDark, ruinLight, islandLightDir), tx, baseY + st2 * S * 0.032, tz + S * (0.15 + st2 * 0.065));
    }
  }
  // 合并 → 单一网格
  const g = new THREE.Group();
  const mesh = new THREE.Mesh(mergeColored(parts), islandMat);
  g.add(mesh);
  // 草面白花（少量 Sprite）
  const flowerN = S > 10 ? 4 : S > 6 ? 3 : 2;
  for (let fl2 = 0; fl2 < flowerN; fl2++) {
    const fp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffffff, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.8, depthWrite: false }));
    fp.scale.set(S * 0.03, S * 0.03, 1);
    const angF = Math.random() * Math.PI * 2, radF = Math.sqrt(Math.random()) * S * 0.75;
    fp.position.set(Math.cos(angF) * radF, S * 0.44, Math.sin(angF) * radF);
    g.add(fp);
  }
  return g;
}

// 大浮岛：优先加载用户 GLB 模型（trimesh 生成，顶点色网格），失败回退程序化
async function setupBigIslands() {
  try {
    const { GLTFLoader } = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js");
    const loader = new GLTFLoader();
    const gltf = await new Promise((res, rej) => loader.load("./assets/island_tree_glb.glb", res, undefined, rej));
    const template = gltf.scene;
    template.traverse((o) => {
      if (o.isMesh) {
        const geo = o.geometry;
        const ca = geo.attributes.color;
        if (ca && ca.itemSize === 4) {   // RGBA 顶点色 → 转 RGB
          const rgb = new Float32Array(ca.count * 3);
          for (let ci = 0; ci < ca.count; ci++) {
            rgb[ci * 3] = ca.getX(ci); rgb[ci * 3 + 1] = ca.getY(ci); rgb[ci * 3 + 2] = ca.getZ(ci);
          }
          geo.setAttribute("color", new THREE.BufferAttribute(rgb, 3));
        }
        o.material = new THREE.MeshBasicMaterial({ vertexColors: true });
      }
    });
    const GLB_BANDS = [
      { z0: 72,  z1: 108, s0: 1.00, s1: 1.28, x0: 26, x1: 42 },
      { z0: 118, z1: 165, s0: 1.30, s1: 1.68, x0: 30, x1: 54 },
      { z0: 172, z1: 240, s0: 1.75, s1: 2.30, x0: 38, x1: 72 }
    ];
    for (let i2 = 0; i2 < 3; i2++) {
      const band = GLB_BANDS[i2];
      const inst = template.clone();
      const zPos = -(band.z0 + Math.random() * (band.z1 - band.z0));
      const sc = band.s0 + Math.random() * (band.s1 - band.s0);
      inst.scale.setScalar(sc);
      inst.userData.r = 5.4 * sc;
      inst.rotation.y = Math.random() * Math.PI * 2;
      const yUp = i2 % 2 === 1;
      inst.position.set(
        (yUp ? 1 : (Math.random() < 0.5 ? -1 : 1)) * (band.x0 + Math.random() * (band.x1 - band.x0)),
        7.8 * sc + 2.5 + (yUp ? 12 + Math.random() * 14 : Math.random() * 7),
        zPos
      );
      inst.userData.phase = Math.random() * 6;
      scene.add(inst); islands.push(inst);
    }
  } catch (e) {
    // 回退：程序化大岛
    const FB_BANDS = [
      { z0: 72, z1: 108, s0: 6, s1: 8, x0: 26, x1: 42 },
      { z0: 118, z1: 165, s0: 8, s1: 10, x0: 30, x1: 54 },
      { z0: 172, z1: 240, s0: 10, s1: 13, x0: 38, x1: 72 }
    ];
    for (let i2 = 0; i2 < 3; i2++) {
      const band = FB_BANDS[i2];
      const zPos = -(band.z0 + Math.random() * (band.z1 - band.z0));
      const S = band.s0 + Math.random() * (band.s1 - band.s0);
      const g = buildIsland(S);
      g.userData.r = 1.2 * S;
      const yUp = i2 % 2 === 1;
      g.position.set(
        (Math.random() < 0.5 ? -1 : 1) * (band.x0 + Math.random() * (band.x1 - band.x0)),
        S + 2.5 + (yUp ? 12 + Math.random() * 14 : Math.random() * 7),
        zPos
      );
      g.userData.phase = Math.random() * 6;
      scene.add(g); islands.push(g);
    }
  }
}
setupBigIslands();

// ===== 程序化大地形（塞尔达风：丘陵 + 悬崖台地 + 高山 + 河流 + 树林，周期无缝滚动）=====
const TERRAIN_PERIOD = 200;
const terrainMat = new THREE.MeshBasicMaterial({ vertexColors: true });
const waterMat = new THREE.MeshBasicMaterial({ color: 0x5fa8d0 });
const pathMat = new THREE.MeshBasicMaterial({ color: 0xd8c08a });
const scatterMat = new THREE.MeshBasicMaterial({ vertexColors: true });
const grassA = new THREE.Color(0x4e9a4a), grassB = new THREE.Color(0x8ccf5e), grassC = new THREE.Color(0x6ab84e);
const rockC = new THREE.Color(0x8a7f6a), snowC = new THREE.Color(0xf0f4f8), sandC = new THREE.Color(0xd8c48a);
const tTrunkDark = new THREE.Color(0x3a3226), tTrunkLight = new THREE.Color(0x6a5c46);
const tTreeDark = new THREE.Color(0x2d7a3e), tTreeLight = new THREE.Color(0x8ade66);
const bushDark = new THREE.Color(0x2f6e3c), bushLight = new THREE.Color(0x74b85a);

function riverX(z) {
  return 26 * Math.sin(z * Math.PI * 2 / TERRAIN_PERIOD + 0.6);
}
function heightAt(x, z) {
  const kz = (n) => z * (Math.PI * 2 / TERRAIN_PERIOD) * n;
  let h = Math.sin(x * 0.045 + 1.2) * Math.cos(kz(2)) * 1.5
    + Math.sin(x * 0.09) * Math.sin(kz(3) + 1.1) * 1.1
    + Math.sin(kz(1) + x * 0.02) * 0.8;
  const dR = Math.abs(x - riverX(z));
  h -= (1 - THREE.MathUtils.smoothstep(dR, 7, 17)) * 5.5;
  const ax = Math.abs(x);
  const mesa = THREE.MathUtils.smoothstep(ax, 56, 62) - THREE.MathUtils.smoothstep(ax, 80, 88);
  h += mesa * 9;
  const mount = THREE.MathUtils.smoothstep(ax, 88, 140);
  h += mount * (22 + Math.sin(x * 0.03 + kz(2)) * 9 + Math.sin(kz(3) + 2.0) * 7);
  return -5 + h;
}
function colorAt(x, z, y, slope) {
  const c = new THREE.Color();
  const n = (Math.sin(x * 0.11 + z * 0.07) * Math.cos(z * 0.05 + 1.3) + 1) / 2;
  c.copy(grassA).lerp(grassB, n).lerp(grassC, Math.random() * 0.12);
  if (slope > 0.5) c.lerp(rockC, Math.min(1, (slope - 0.5) * 2.4));
  if (y > 11) c.lerp(rockC, Math.min(1, (y - 11) / 12));
  if (y > 24) c.lerp(snowC, Math.min(1, (y - 24) / 9));
  const dR = Math.abs(x - riverX(z));
  if (y < -6.6 && dR < 15) c.lerp(sandC, 0.8);
  return c;
}

const terrainChunks = [];
function buildTerrainChunk() {
  const W = 320, D = TERRAIN_PERIOD;
  const SEG_X = 96, SEG_Z = 60;
  const posArr = [], colArr = [], idxArr = [];
  const lightDir = new THREE.Vector3(-0.4, 0.85, 0.35).normalize();
  const nrmV = new THREE.Vector3();
  for (let iz = 0; iz <= SEG_Z; iz++) {
    for (let ix = 0; ix <= SEG_X; ix++) {
      const x = (ix / SEG_X - 0.5) * W;
      const z = iz / SEG_Z * D;
      const y = heightAt(x, z);
      const e = 1.2;
      const gx = (heightAt(x + e, z) - heightAt(x - e, z)) / (2 * e);
      const gz = (heightAt(x, z + e) - heightAt(x, z - e)) / (2 * e);
      const slope = Math.sqrt(gx * gx + gz * gz);
      // 解析法线 + 逐顶点平滑着色（按位置计算，跨地块接缝天然连续）
      nrmV.set(-gx, 1, -gz).normalize();
      const lum = Math.max(0, nrmV.dot(lightDir));
      const shade = 0.78 + lum * 0.34;
      const c = colorAt(x, z, y, slope).multiplyScalar(shade);
      posArr.push(x, y, z);
      colArr.push(c.r, c.g, c.b);
    }
  }
  const VID = (ix, iz) => iz * (SEG_X + 1) + ix;
  for (let iz = 0; iz < SEG_Z; iz++) {
    for (let ix = 0; ix < SEG_X; ix++) {
      const a = VID(ix, iz), b = VID(ix + 1, iz), c = VID(ix, iz + 1), d = VID(ix + 1, iz + 1);
      idxArr.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colArr, 3));
  geo.setIndex(idxArr);
  const chunk = new THREE.Group();
  chunk.add(new THREE.Mesh(geo, terrainMat));

  // 河流水带
  {
    const wpa = [], wia = [];
    const half = 7.5;
    for (let z = 0; z <= D; z += 4) {
      const xr = riverX(z);
      wpa.push(xr - half, -6.0, z, xr + half, -6.0, z);
    }
    for (let i = 0; i < wpa.length / 6 - 1; i++) {
      const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
      wia.push(a, c, b, b, c, d);
    }
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.Float32BufferAttribute(wpa, 3));
    wg.setIndex(wia);
    chunk.add(new THREE.Mesh(wg, waterMat));
  }

  // 泥土小径（避开河道处断开）
  {
    const pts = [];
    for (let z = 4; z <= D - 4; z += 5) {
      const xp = -16 * Math.sin(z * Math.PI * 2 / TERRAIN_PERIOD + 2.2);
      if (Math.abs(xp - riverX(z)) < 11) { pts.push(null); continue; }
      pts.push(new THREE.Vector3(xp, heightAt(xp, z) + 0.14, z));
    }
    const segs = [];
    let cur = [];
    for (const p of pts) {
      if (p) cur.push(p); else { if (cur.length > 1) segs.push(cur); cur = []; }
    }
    if (cur.length > 1) segs.push(cur);
    for (const seg of segs) {
      const pa = [], ia2 = [];
      for (let i2 = 0; i2 < seg.length; i2++) {
        const p = seg[i2];
        const prev = seg[Math.max(0, i2 - 1)], next = seg[Math.min(seg.length - 1, i2 + 1)];
        const dir = new THREE.Vector3().subVectors(next, prev);
        dir.y = 0; dir.normalize();
        const sx = -dir.z * 2, sz = dir.x * 2;
        pa.push(p.x - sx, p.y, p.z - sz, p.x + sx, p.y, p.z + sz);
      }
      for (let i2 = 0; i2 < seg.length - 1; i2++) {
        const a = i2 * 2, b = a + 1, c = a + 2, d = a + 3;
        ia2.push(a, b, c, b, d, c);
      }
      const pg = new THREE.BufferGeometry();
      pg.setAttribute('position', new THREE.Float32BufferAttribute(pa, 3));
      pg.setIndex(ia2);
      chunk.add(new THREE.Mesh(pg, pathMat));
    }
  }

  // 树木 / 灌木 / 岩石（批量合并）
  {
    const parts = [];
    // 树木：一丛一丛的森林（随机林心 + 林内散布），三种树形混种，巨树可到原树形的 200%
    const treeAt = (x, z, s, kind) => {
      const y = heightAt(x, z);
      if (y > 6) return;
      if (Math.abs(x - riverX(z)) < 9) return;
      if (kind === 0) {
        // 杉树：细杆 + 三层锥冠
        parts.push({ geo: shadeFaces(new THREE.CylinderGeometry(0.08 * s, 0.14 * s, 1.0 * s, 5), tTrunkDark, tTrunkLight, lightDir), matrix: new THREE.Matrix4().setPosition(x, y + 0.5 * s, z) });
        for (let k = 0; k < 3; k++) {
          parts.push({ geo: shadeFaces(new THREE.ConeGeometry(s * (0.75 - k * 0.2), s * 0.85, 7), tTreeDark, tTreeLight, lightDir), matrix: new THREE.Matrix4().setPosition(x, y + s * (1.0 + k * 0.52), z) });
        }
      } else if (kind === 1) {
        // 阔叶树：杆 + 双团冠
        parts.push({ geo: shadeFaces(new THREE.CylinderGeometry(0.1 * s, 0.16 * s, 0.9 * s, 5), tTrunkDark, tTrunkLight, lightDir), matrix: new THREE.Matrix4().setPosition(x, y + 0.45 * s, z) });
        for (let c2 = 0; c2 < 2; c2++) {
          const cs = s * (0.55 - c2 * 0.15);
          parts.push({ geo: shadeFaces(new THREE.IcosahedronGeometry(cs, 1), tTreeDark, tTreeLight, lightDir), matrix: new THREE.Matrix4().setPosition(x + (Math.random() - 0.5) * 0.4 * s, y + s * (0.95 + c2 * 0.35), z + (Math.random() - 0.5) * 0.4 * s) });
        }
      } else {
        // 高树：细长杆 + 顶部大小双冠
        parts.push({ geo: shadeFaces(new THREE.CylinderGeometry(0.09 * s, 0.18 * s, 1.6 * s, 5), tTrunkDark, tTrunkLight, lightDir), matrix: new THREE.Matrix4().setPosition(x, y + 0.8 * s, z) });
        parts.push({ geo: shadeFaces(new THREE.IcosahedronGeometry(s * 0.62, 1), tTreeDark, tTreeLight, lightDir), matrix: new THREE.Matrix4().setPosition(x, y + 1.75 * s, z) });
        parts.push({ geo: shadeFaces(new THREE.IcosahedronGeometry(s * 0.38, 1), tTreeDark, tTreeLight, lightDir), matrix: new THREE.Matrix4().setPosition(x + s * 0.3, y + 1.45 * s, z - s * 0.1) });
      }
    };
    const groveN = 11 + Math.floor(Math.random() * 4);
    for (let g = 0; g < groveN; g++) {
      const gx = (Math.random() - 0.5) * 150;
      const gz = 10 + Math.random() * (D - 20);
      const gr = 6 + Math.random() * 9;
      const gn = 3 + Math.floor(Math.random() * 6);
      for (let k = 0; k < gn; k++) {
        const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * gr;
        const x = gx + Math.cos(a) * rr, z = gz + Math.sin(a) * rr;
        if (Math.abs(x) > 150) continue;
        const s0 = 1.5 + Math.random() * 2.2;
        const s = Math.random() < 0.14 ? s0 * 2 : s0;   // 少量巨树（最高约为旧上限的 200%）
        treeAt(x, z, s, Math.floor(Math.random() * 3));
      }
    }
    for (let i = 0; i < 5; i++) {
      treeAt((Math.random() - 0.5) * 150, 8 + Math.random() * (D - 16), 1.5 + Math.random() * 1.8, Math.floor(Math.random() * 3));
    }
    for (let i = 0; i < 26; i++) {
      const x = (Math.random() - 0.5) * 160;
      const z = 6 + Math.random() * (D - 12);
      const y = heightAt(x, z);
      if (y > 8 || Math.abs(x - riverX(z)) < 9) continue;
      const bs = 0.7 + Math.random() * 0.9;
      const bg = shadeFaces(new THREE.IcosahedronGeometry(bs, 0), bushDark, bushLight, lightDir);
      const m3 = new THREE.Matrix4(); m3.setPosition(x, y + bs * 0.6, z);
      parts.push({ geo: bg, matrix: m3 });
    }
    for (let i = 0; i < 18; i++) {
      const x = (Math.random() - 0.5) * 170;
      const z = 6 + Math.random() * (D - 12);
      const y = heightAt(x, z);
      if (Math.abs(x - riverX(z)) < 8) continue;
      const rs = 0.5 + Math.random() * 1.1;
      const rg = shadeFaces(new THREE.IcosahedronGeometry(rs, 0), new THREE.Color(0x6a6a72), new THREE.Color(0xa8a8b2), lightDir);
      const m4 = new THREE.Matrix4(); m4.setPosition(x, y + rs * 0.5, z);
      parts.push({ geo: rg, matrix: m4 });
    }
    if (parts.length) chunk.add(new THREE.Mesh(mergeColored(parts), scatterMat));
  }
  return chunk;
}

function buildCumulus(csize) {
  const parts = [];
  const puffN = 4 + Math.floor(Math.random() * 4);
  for (let p2 = 0; p2 < puffN; p2++) {

      new THREE.Quaternion(),

    parts.push({ geo, matrix: m });
  }
  return new THREE.Mesh(mergeColored(parts), cumulusMat);
}

  g.add(head);
  const streak = new THREE.Mesh(tracerStreakGeo, tracerMat);
  streak.position.y = -1.5;
  g.add(streak);
  return g;
}

// ===== 关卡状态 =====
let levelIdx = 0, levelKills = 0, levelOver = false, bossSpawned = false;

function showBanner(lev, isVictory) {
  const b = $("banner");
  if (isVictory) {
    $("bLayer").textContent = "全 部 通 关";
    $("bName").textContent = "血月渐隐";
    $("bSub").textContent = "得分 " + score + " ｜ 暮林归航";
  } else {
    $("bLayer").textContent = LAYER_ZH[lev] || "第" + (lev + 1) + "关";
    $("bName").textContent = LEVELS[lev].name;
    $("bSub").textContent = LEVELS[lev].sub;
  }
  b.classList.add("show");
  setTimeout(() => b.classList.remove("show"), 2600);
}

function applyLevel() {
  const L = LEVELS[levelIdx];
  spawnRate = L.spawnMs;
  worldSpeedBase = L.speed;
  levelKills = 0;
  bossSpawned = false;
  $("levelName").textContent = (levelIdx + 1) + " · " + L.name;
  $("levelKill").textContent = "0/" + L.quota;
  $("killFill").style.width = "0%";
  $("bossBar").style.display = "none";
  if (L.types.includes("boss")) bossSpawned = false;
  showBanner(levelIdx, false);
}

function spawnEnemy(forceType) {
  const L = LEVELS[levelIdx];
  const typeKey = forceType || L.types[Math.floor(Math.random() * L.types.length)];
  const spec = ENEMY_TYPES[typeKey];
  const m = new THREE.Mesh(enemyGeo, enemyBodyMat);
  m.scale.setScalar(spec.size);
  const core = new THREE.Mesh(enemyCoreGeo, enemyCoreMats[typeKey]);   // 彩色余烬核心（Mesh 材质）
  m.add(core);
  m.add(new THREE.Mesh(enemyWireGeo, enemyWireMat));
  if (spec.shield) m.add(new THREE.Mesh(shieldGeo, shieldMat));
  m.position.set((Math.random() - 0.5) * 18, 12 + (Math.random() - 0.5) * 7, -(95 + Math.random() * 25));
  m.scale.setScalar(spec.size * 0.35);
  m.userData = {
    type: typeKey, hp: spec.hp, baseX: m.position.x, phase: Math.random() * Math.PI * 2,
    zig: spec.zig || 0, pulse: !!spec.pulse, boss: !!spec.boss, spec
  };
  scene.add(m); enemies.push(m);
  if (spec.boss) {
    $("bossBar").style.display = "block";
    $("bossFill").style.width = "100%";
  }
}

function hitEnemy(e, dmg) {
  const ud = e.userData;
  ud.hp -= dmg;
  if (ud.spec.shield && ud.hp === 1) {
    const sh = e.children.find(c => c.geometry === shieldGeo);
    if (sh) sh.visible = false;
  }
  if (ud.hp <= 0) { killEnemy(e); return; }
  // 命中反馈：短暂高亮
  e.material = enemyHlMat;
  e.userData.hitT = performance.now();
  if (ud.boss) $("bossFill").style.width = Math.max(0, ud.hp / ud.spec.hp * 100) + "%";
}

function killEnemy(m) {
  scene.remove(m);
  kills++;
  enemies.splice(enemies.indexOf(m), 1);
  deaths.push({ m, t: 0 });
  const pts = m.userData.spec.pts;
  score += pts;
  levelKills++;
  $("score").textContent = score;
  const L = LEVELS[levelIdx];
  if (L.types.includes("boss") && m.userData.boss) {
    levelOver = true;
    showBanner(levelIdx, true);
    $("bossBar").style.display = "none";
    $("wstate").textContent = "全 部 通 关";
    return;
  }
  $("levelKill").textContent = Math.min(levelKills, L.quota) + "/" + L.quota;
  $("killFill").style.width = Math.min(100, levelKills / L.quota * 100) + "%";
  if (levelKills >= L.quota && levelIdx < LEVELS.length - 1) {
    levelIdx++;
    applyLevel();
  }
}

// ===== 生命 / 碰撞 / 死亡 / 重开 =====
function updateLivesHud() {
  const el = document.getElementById("lives");
  if (el) el.textContent = "♥".repeat(Math.max(lives, 0)) + "♡".repeat(Math.max(3 - lives, 0));
}
function loseLife() {
  if (performance.now() < invincT) return;   // 双保险：无敌期内不重复扣命
  lives = Math.max(0, lives - 1);
  updateLivesHud();
  const fx = document.getElementById("flash");
  if (fx) {
    fx.style.transition = "none";
    fx.style.background = "#ff4040";
    fx.style.opacity = "0.4";
    requestAnimationFrame(() => { fx.style.transition = "opacity .6s"; fx.style.opacity = "0"; });
  }
  invincT = performance.now() + 2000;
  if (lives <= 0) gameOver();
}
// 撞浮空岛：无论剩余生命，直接坠机
function instantDeath() {
  if (performance.now() < invincT) return;   // 防同帧重复触发
  lives = 0;
  updateLivesHud();
  const fx = document.getElementById("flash");
  if (fx) {
    fx.style.transition = "none";
    fx.style.background = "#ff4040";
    fx.style.opacity = "0.55";
    requestAnimationFrame(() => { fx.style.transition = "opacity .8s"; fx.style.opacity = "0"; });
  }
  invincT = performance.now() + 2000;
  gameOver();
}
function gameOver() {
  state.running = false;
  plane.visible = false;
  reticle.visible = false;
  traj.visible = false;
  document.getElementById("goScore").textContent = score;
  document.getElementById("goKills").textContent = kills;
  document.getElementById("gameover").style.display = "flex";
}
function resetGame() {
  score = 0; kills = 0; lives = 3; invincT = performance.now() + 1500;
  levelIdx = 0; levelKills = 0; levelOver = false; bossSpawned = false;
  weapons.ultScoreAtLast = 0; weapons.ultEndT = null;
  weapons.ultRocketsLeft = 0; weapons.ultMissilesLeft = 0;
  weapons.rocketAmmo = ROCKET_MAG; weapons.rocketReloadT = null; weapons.rocketNext = 0;
  weapons.missileReserve = MISSILE_RESERVE_MAX; weapons.missileReloadT = null;
  weapons.chargeStart = null; weapons.chargeTarget = null; weapons.firedAt = null;
  for (const e of [...enemies]) scene.remove(e); enemies.length = 0;
  for (const b of [...bullets]) scene.remove(b); bullets.length = 0;
  for (const r of [...rockets]) scene.remove(r); rockets.length = 0;
  for (const m of [...missiles]) scene.remove(m); missiles.length = 0;
  for (const d of [...deaths]) scene.remove(d.m); deaths.length = 0;
  for (const hz of [...hazards]) scene.remove(hz); hazards.length = 0;
  nextHazard = performance.now() + 4000;
  reticle.visible = false; traj.visible = true;
  plane.visible = true;
  plane.position.set(0, 12, 0);
  plane.rotation.set(0, 0, 0);
  document.getElementById("score").textContent = 0;
  document.getElementById("lives").textContent = "♥♥♥";
  document.getElementById("gameover").style.display = "none";
  applyLevel();
  state.running = true;
}
document.getElementById("restartBtn").addEventListener("click", resetGame);

// ===== 武器 =====
const weapons = {
  mgNext: 0, ultHeld: false, ultLast: -9999, chargeStart: null, firedAt: null, chargeTarget: null,
  rocketAmmo: 10, rocketReloadT: null, rocketNext: 0,
  missileReserve: 4, missileReloadT: null,
  ultEndT: null, ultRocketsLeft: 0, ultMissilesLeft: 0, ultRocketsNext: 0, ultMissilesNext: 0,
  ultScoreAtLast: 0
};
const MISSILE_CHARGE_MS = 1500;
const ROCKET_MAG = 10, ROCKET_RELOAD_MS = 3000, ROCKET_INTERVAL_MS = 500;
const MISSILE_RESERVE_MAX = 4, MISSILE_RELOAD_ONE_MS = 4000;
const ULT_DURATION_MS = 10000, ULT_COST = 100;

function fireMG() {
  const b = makeBulletMesh();
  b.position.copy(plane.position); b.position.z -= 1.2;
  b.userData.dir = state.aimWorld.clone().sub(b.position).normalize();
  b.quaternion.setFromUnitVectors(Y_POS, b.userData.dir);
  scene.add(b); bullets.push(b);
}
function fireRocket() {
  const r = new THREE.Mesh(rocketGeo, rocketMat);
  r.position.copy(plane.position); r.position.z -= 1.5;
  r.userData.dir = state.aimWorld.clone().sub(r.position).normalize();
  r.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), r.userData.dir);
  scene.add(r); rockets.push(r);
}
function launchMissile(target) {
  const m = new THREE.Mesh(missileGeo, missileMat);
  m.position.copy(plane.position); m.position.z -= 1.5;
  m.userData.dir = new THREE.Vector3(0, 0, -1);
  m.userData.target = target || null;
  if (!m.userData.target) {
    let best = null, bd = 1e9;
    for (const e of enemies) {
      const d = e.position.distanceTo(state.aimWorld);
      if (d < bd) { bd = d; best = e; }
    }
    m.userData.target = best;
  }
  scene.add(m); missiles.push(m);
}
function fireMGHoming(offsetX) {
  const b = makeBulletMesh();
  b.position.set(plane.position.x + offsetX, plane.position.y, plane.position.z - 1.0);
  let best = null, bd = 1e9;
  for (const e of enemies) {
    const d = e.position.distanceTo(plane.position);
    if (d < bd) { bd = d; best = e; }
  }
  b.userData.dir = best ? best.position.clone().sub(b.position).normalize() : new THREE.Vector3(0, 0, -1);
  b.userData.target = best;
  b.userData.homing = true;

  b.quaternion.setFromUnitVectors(Y_POS, b.userData.dir);
  scene.add(b); bullets.push(b);
}

// ===== 启动 =====
const video = document.createElement("video");
video.setAttribute("playsinline", ""); video.muted = true;
const pip = $("pip"), pctx = pip.getContext("2d");
const det = document.createElement("canvas");
const dctx = det.getContext("2d");
let recognizer = null;

$("startBtn").addEventListener("click", start);

async function start() {
  const btn = $("startBtn"), msg = $("bootMsg");
  btn.disabled = true;
  try {
    msg.style.color = "";
    msg.textContent = "① 加载识别库与 3D 库…";
    let lib, wasmUrl = WASM_URL, modelUrl = MODEL_URL;
    try {
      lib = await import(LIB_URL);
    } catch (e) {
      // file:// 双击打开时浏览器会拦截本地 ES 模块，此时回退 CDN
      msg.textContent = "① 本地依赖被拦截（file:// 模式），回退 CDN…";
      lib = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
      wasmUrl = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
      modelUrl = "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task";
    }
    msg.textContent = "② 请求摄像头权限…";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    msg.textContent = "③ 加载手势模型（约 8MB）…";
    const vision = await lib.FilesetResolver.forVisionTasks(wasmUrl);
    try {
      recognizer = await lib.GestureRecognizer.createFromOptions(vision, {
        baseOptions: { modelAssetPath: modelUrl, delegate: "GPU" }, runningMode: "VIDEO", numHands: 2
      });
    } catch (e) {
      recognizer = await lib.GestureRecognizer.createFromOptions(vision, {
        baseOptions: { modelAssetPath: modelUrl, delegate: "CPU" }, runningMode: "VIDEO", numHands: 2
      });
    }
    pip.width = video.videoWidth; pip.height = video.videoHeight;
    det.width = 640; det.height = Math.round(640 * video.videoHeight / video.videoWidth);
    applyLevel();
    for (let i = 0; i < 3; i++) spawnEnemy("basic");
    $("boot").style.display = "none";
    state.running = true;
    state.lastHandT = performance.now();
  } catch (err) {
    msg.textContent = "";
    $("bootMsg").style.color = "#ff8a8a";
    $("bootMsg").textContent = err.name === "NotAllowedError"
      ? "摄像头权限被拒绝 — 地址栏允许后刷新"
      : err.name === "NotReadableError"
        ? "摄像头被占用 — 关掉其他使用摄像头的页面再刷新"
        : "启动失败: " + err.message;
    btn.disabled = false;
  }
}

// ===== 主循环 =====
let lastT = 0;
let fpsEma = 0, fpsLastDomT = 0;

function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;

  const fpsNow = dt > 0 ? 1 / dt : 0;
  fpsEma = fpsEma ? fpsEma * 0.95 + fpsNow * 0.05 : fpsNow;

  // 视觉步骤
  if (state.running && video.currentTime !== state.lastVideoTime) {
    state.lastVideoTime = video.currentTime;
    const w = pip.width, h = pip.height;
    pctx.save(); pctx.translate(w, 0); pctx.scale(-1, 1); pctx.drawImage(video, 0, 0, w, h); pctx.restore();
    dctx.save(); dctx.translate(det.width, 0); dctx.scale(-1, 1); dctx.drawImage(video, 0, 0, det.width, det.height); dctx.restore();
    const res = recognizer.recognizeForVideo(det, t);
    process(res, t);
    drawSkeleton();
  }

  const R = state.right, L = state.left;

  // ===== 驾驶 =====
  let throttle = 1;
  if (L.openS !== null) throttle = THREE.MathUtils.clamp((L.openS - 1.1) / (1.9 - 1.1) * 5, 0, 5) / 5;
  const gear = Math.round(throttle * 5);

  if (L.xS !== null) {
    let targetX = (L.xS - 0.5) * 20;
    if (L.bankS !== null) targetX += (L.bankS / 60) * 4;
    targetX = THREE.MathUtils.clamp(targetX, -12, 12);
    plane.position.x += (targetX - plane.position.x) * 0.25;
  }
  if (L.yS !== null) {
    const targetY = 12 + (0.5 - L.yS) * 9;   // 飞行高度带中心 12（浮岛群中段）
    plane.rotation.x = THREE.MathUtils.clamp((targetY - plane.position.y) * 0.12, -0.45, 0.45);
    plane.position.y += (targetY - plane.position.y) * 0.25;
  }
  if (L.bankS !== null) plane.rotation.z = THREE.MathUtils.degToRad(-L.bankS);

  // 相机视差
  {
    const kCam = 1 - Math.exp(-dt * 4);
    camera3.position.x += (plane.position.x * 0.18 - camera3.position.x) * kCam;
    camera3.position.y += (13.5 + (plane.position.y - 12) * 0.15 - camera3.position.y) * kCam;
  }
  camera3.updateMatrixWorld();

  // ===== 瞄准与轨迹线 =====
  {
    const fdx = THREE.MathUtils.clamp(dzf(state.right.dx / 0.145), -1, 1);
    const fdy = THREE.MathUtils.clamp(dzf(-state.right.dy / 0.145), -1, 1);
    state.aimWorld.set(plane.position.x + fdx * 9, plane.position.y + fdy * 9, -70);
    const muzz = new THREE.Vector3(plane.position.x, plane.position.y, plane.position.z - 1.5);
    const dirV = state.aimWorld.clone().sub(muzz);
    const len = Math.max(dirV.length(), 1);
    dirV.normalize();
    traj.position.copy(muzz).addScaledVector(dirV, len / 2);
    traj.quaternion.setFromUnitVectors(Y_POS, dirV);
    traj.scale.set(1, len, 1);
    _v1.set(state.aimWorld.x - plane.position.x, state.aimWorld.y - plane.position.y, state.aimWorld.z - plane.position.z);
    const abLenSq = Math.max(_v1.lengthSq(), 1e-6);
    for (const e of enemies) {
      _v2.set(e.position.x - plane.position.x, e.position.y - plane.position.y, e.position.z - plane.position.z);
      const tt = THREE.MathUtils.clamp(_v2.dot(_v1) / abLenSq, 0, 1);
      _v3.copy(_v1).multiplyScalar(tt);
      const dx = _v2.x - _v3.x, dy = _v2.y - _v3.y, dz = _v2.z - _v3.z;
      const on = dx * dx + dy * dy + dz * dz < 2.25;
      if (e.userData.hl !== on) {
        e.userData.hl = on;
        e.material = on ? enemyHlMat : enemyMats[e.userData.type];
      }
    }
  }

  // ===== 武器逻辑 =====
  const inUlt = weapons.ultEndT != null && t < weapons.ultEndT;
  const rocketPose = state.running && (R.gest === "Pointing_Up" || R.gun);
  const mgNow = state.running && R.gest === "Thumb_Up";   // 点赞姿势 = 机枪开火
  const ultNow = state.running && R.gest === "ILoveYou";
  const missilePose = state.running && R.gest === "Victory";

  if (mgNow && !inUlt) {
    if (t >= weapons.mgNext) { fireMG(); weapons.mgNext = t + 110; }
  } else if (!mgNow) weapons.mgNext = 0;

  if (weapons.rocketReloadT != null && t - weapons.rocketReloadT >= ROCKET_RELOAD_MS) {
    weapons.rocketAmmo = ROCKET_MAG; weapons.rocketReloadT = null;
  }
  if (rocketPose && !inUlt && weapons.rocketReloadT == null && weapons.rocketAmmo > 0 && t >= weapons.rocketNext) {
    fireRocket();
    weapons.rocketAmmo--;
    weapons.rocketNext = t + ROCKET_INTERVAL_MS;
    if (weapons.rocketAmmo <= 0) weapons.rocketReloadT = t;
  }

  if (weapons.missileReserve < MISSILE_RESERVE_MAX && weapons.missileReloadT == null) weapons.missileReloadT = t;
  if (weapons.missileReloadT != null && t - weapons.missileReloadT >= MISSILE_RELOAD_ONE_MS) {
    weapons.missileReserve++;
    weapons.missileReloadT = null;
  }

  // 大招：100 分门槛
  const ultReady = (score - weapons.ultScoreAtLast) >= ULT_COST;
  if (ultNow && !weapons.ultHeld && !inUlt && ultReady && !levelOver) {
    weapons.ultEndT = t + ULT_DURATION_MS;
    weapons.ultLast = t;
    weapons.ultScoreAtLast = score;
    weapons.ultRocketsLeft = 20; weapons.ultRocketsNext = t + 300;
    weapons.ultMissilesLeft = 8; weapons.ultMissilesNext = t + 500;
    $("flash").style.transition = "none";
    $("flash").style.opacity = "0.7";
    requestAnimationFrame(() => { $("flash").style.transition = "opacity .5s"; $("flash").style.opacity = "0"; });
  }
  weapons.ultHeld = ultNow;
  if (inUlt) {
    if (weapons.ultRocketsLeft > 0 && t >= weapons.ultRocketsNext) { fireRocket(); weapons.ultRocketsLeft--; weapons.ultRocketsNext = t + 500; }
    if (weapons.ultMissilesLeft > 0 && t >= weapons.ultMissilesNext) { launchMissile(null); weapons.ultMissilesLeft--; weapons.ultMissilesNext = t + 1250; }
    if (mgNow && t >= weapons.mgNext) { fireMGHoming(-0.9); fireMGHoming(0.9); weapons.mgNext = t + 140; }
  }

  const rocketNow = rocketPose && !inUlt;
  const missileNow = missilePose && !inUlt;

  // 导弹蓄力
  let lockPct = 0;
  const lockOn = missileNow && performance.now() - R.seenT < 300;
  if (lockOn) {
    if (weapons.chargeTarget && !enemies.includes(weapons.chargeTarget)) {
      weapons.chargeStart = null;
      weapons.chargeTarget = null;
    }
    if (weapons.chargeStart == null) weapons.chargeStart = t;
    if (!weapons.chargeTarget && enemies.length) {
      let best = null, bd = 1e9;
      for (const e of enemies) {
        const d = e.position.distanceTo(state.aimWorld);
        if (d < bd) { bd = d; best = e; }
      }
      weapons.chargeTarget = best;
    }
    reticle.visible = !!weapons.chargeTarget;
    if (weapons.chargeTarget) reticle.position.copy(weapons.chargeTarget.position);
    const held = t - weapons.chargeStart;
    if (held >= MISSILE_CHARGE_MS) {
      if (!weapons.firedAt) {
        if (weapons.missileReserve > 0) {
          weapons.missileReserve--;
          launchMissile(weapons.chargeTarget);
          weapons.firedAt = t;
        } else {
          weapons.chargeStart = t;
        }
      }
      lockPct = 100;
    } else lockPct = held / MISSILE_CHARGE_MS * 100;
  } else {
    weapons.chargeStart = null; weapons.chargeTarget = null; weapons.firedAt = null;
    reticle.visible = false;
  }
  $("lockTrack").style.display = lockOn ? "block" : "none";
  $("lockFill").style.width = lockPct + "%";
  $("ultTrack").style.display = lockOn ? "none" : "block";

  // HUD 状态
  const ws = $("wstate");
  if (levelOver) { ws.textContent = "全 部 通 关"; ws.className = ""; }
  else if (inUlt) { ws.textContent = "💥 火力全开！剩 " + Math.max(0, Math.ceil((weapons.ultEndT - t) / 1000)) + "s"; ws.className = "fire"; }
  else if (lockOn) { ws.textContent = lockPct >= 100 ? "导弹已发射" : "🎯 导弹锁定 " + ((t - weapons.chargeStart) / 1000).toFixed(1) + "s"; ws.className = "fire"; }
  else if (rocketNow) { ws.textContent = weapons.rocketReloadT != null ? "火箭弹 · 换弹中…" : "🚀 火箭弹"; ws.className = "fire"; }
  else if (mgNow) { ws.textContent = "🔫 机枪开火中"; ws.className = "fire"; }
  else { ws.textContent = "空仓静默"; ws.className = ""; }

  $("rkAmmo").textContent = weapons.rocketReloadT != null ? "换弹中…" : weapons.rocketAmmo + "/" + ROCKET_MAG;
  $("msAmmo").textContent = weapons.missileReserve + "/" + MISSILE_RESERVE_MAX;
  const ultLeftMs = Math.max(0, weapons.ultEndT - t);
  const ultPct = inUlt ? Math.min(100, ultLeftMs / ULT_DURATION_MS * 100)
    : Math.min(100, (score - weapons.ultScoreAtLast) / ULT_COST * 100);
  $("ultFill").style.width = ultPct + "%";
  $("ultLabel").textContent = inUlt ? "💥 火力全开！剩 " + Math.ceil(ultLeftMs / 1000) + " 秒"
    : (levelOver ? "旅 途 完 结" : "火力全开 充能 " + Math.min(ULT_COST, score - weapons.ultScoreAtLast) + "/" + ULT_COST);

  // ===== 环境动态：天色循环 + 松林后移 + 萤火虫漂移 =====
  {
    // 天色循环：每 40 秒切换时段，颜色/雾/黑暗度平滑过渡
    skyT += dt;
    if (skyT > 60) {
      skyT = 0;
      skyIdx = (skyIdx + 1) % SKY_PHASES.length;
      $("dayPhase").textContent = SKY_PHASES[skyIdx].name;
    }
    const P = SKY_PHASES[skyIdx];
    const k = 1 - Math.exp(-dt * 0.9);
    curSkyTop.lerp(_cTmp.setHex(P.top), k);
    curSkyMid.lerp(_cTmp.setHex(P.mid), k);
    curSkyBot.lerp(_cTmp.setHex(P.bot), k);
    curFog.lerp(_cTmp.setHex(P.fog), k);
    curDark += (P.dark - curDark) * k;
    sky.material.uniforms.top.value.copy(curSkyTop);
    sky.material.uniforms.mid.value.copy(curSkyMid);
    sky.material.uniforms.bot.value.copy(curSkyBot);
    scene.fog.color.copy(curFog);
    // 太阳/月亮：颜色与位置随时段迁移
    sunSprite.material.color.lerp(_cTmp.setHex(P.sun), k);
    sunSprite.position.x += (P.sunX - sunSprite.position.x) * k * 0.5;
    sunSprite.position.y += (P.sunY - sunSprite.position.y) * k * 0.5;
    // 星空 / 萤火 / 灯笼的显隐随黑暗度
    curGround.lerp(_cTmp.setHex(P.ground), k);
    curPuff.lerp(_cTmp.setHex(P.puff), k);
    cloudPuffMat.color.copy(curPuff);
    starsMat.opacity = 0.02 + 0.95 * curDark;
    flies.material.opacity = 0.12 + 0.8 * curDark;
    // 云海贴片后移
    for (let ci = 0; ci < cloudPuffs.length; ci++) {
      cloudPuffs[ci].position.z += 12 * throttle * dt * 0.25;
      if (cloudPuffs[ci].position.z > -70) cloudPuffs[ci].position.z -= 190;
    }
    // 浮岛轻浮 + 后移
    for (let ii = 0; ii < islands.length; ii++) {
      islands[ii].position.y += Math.sin(t * 0.0008 + ii) * 0.25 * dt;
      islands[ii].position.z += 12 * throttle * dt * 0.35;
      if (islands[ii].position.z > 16) islands[ii].position.z -= 260;
      if (state.running && !levelOver && performance.now() > invincT
          && plane.position.distanceTo(islands[ii].position) < islands[ii].userData.r + 1.25) {
        deaths.push({ m: islands[ii], t: 0 });
        islands.splice(ii, 1); ii--;
        instantDeath();
        continue;
      }
    }
    // 光鳐振翅滑翔
    for (const mm of mantas) {
      mm.scale.y = 0.22 + Math.abs(Math.sin(t * 0.002 + mm.userData.phase)) * 0.5;
      mm.position.x += Math.sin(t * 0.0004 + mm.userData.phase) * 2 * dt;
    }
    // 飞鸟群：振翅 + 横向掠过
    for (const fl of flocks) {
      fl.position.x += fl.userData.vx * dt;
      if (fl.position.x > 62) fl.position.x = -62;
      if (fl.position.x < -62) fl.position.x = 62;
      for (const bird of fl.children) {
        bird.scale.y = 0.12 + Math.abs(Math.sin(t * 0.006 + bird.userData.phase)) * 0.45;
      }
    }
    // 云团：随风缓漂 + 随飞行后退；接近镜头前淡出，避免糊满画面
    for (let ci = 0; ci < clouds.length; ci++) {
      const cl = clouds[ci];
      cl.position.x += Math.sin(t * 0.0002 + ci) * 0.8 * dt;
      cl.position.z += 12 * throttle * dt * cl.userData.spd;
      cl.material.opacity = Math.min(1, Math.max(0, (-cl.position.z - 95) / 25));
      if (cl.position.z > -92) cl.position.z -= 175;
    }

    const worldSpeed = 12 * throttle;
    const fp = flyGeo.attributes.position;
    for (let i = 0; i < FLY_N; i++) {
      flyPos[i * 3 + 1] += Math.sin(t * 0.0012 + flySeed[i]) * 0.35 * dt;
      flyPos[i * 3] += Math.cos(t * 0.0009 + flySeed[i]) * 0.3 * dt;
      if (flyPos[i * 3 + 2] > 12) flyPos[i * 3 + 2] -= 122;
      flyPos[i * 3 + 2] += worldSpeed * dt * 0.35;
    }
    fp.needsUpdate = true;
  }

  // ===== 敌人更新（关卡行为）=====
  if (state.running && !levelOver && t > nextSpawn) {
    const L = LEVELS[levelIdx];
    if (L.types.includes("boss") && !bossSpawned) {
      spawnEnemy("boss");
      bossSpawned = true;
      nextSpawn = t + spawnRate;
    } else if (!L.types.includes("boss") || bossSpawned) {
      if (enemies.length < (L.types.includes("boss") ? 5 : 6)) spawnEnemy();
      nextSpawn = t + spawnRate;
    }
  }
  const worldSpeed = 12 * throttle * worldSpeedBase;
  // 无限地形滚动：两块地交替后移并回卷
  for (const chun of terrainChunks) {
    chun.position.z += worldSpeed * dt;
    if (chun.position.z > 12) chun.position.z -= TERRAIN_PERIOD * 3;
  }
  for (const e of [...enemies]) {
    const ud = e.userData;
    e.position.z += worldSpeed * dt * ud.spec.speed * 1.45;
    if (e.scale.x < ud.spec.size) e.scale.setScalar(Math.min(ud.spec.size, e.scale.x + dt * ud.spec.size * 1.5));
    if (ud.zig) e.position.x = ud.baseX + Math.sin(t * 0.0025 + ud.phase) * ud.zig;
    if (ud.pulse) e.position.z += Math.sin(t * 0.004 + ud.phase) * 8 * dt;
    e.rotation.x += dt * 0.8; e.rotation.y += dt * 0.7;
    if (ud.hitT && performance.now() - ud.hitT > 120) {
      ud.hitT = 0;
      e.material = enemyMats[ud.type];
    }
    if (e.position.z > 8) { scene.remove(e); enemies.splice(enemies.indexOf(e), 1); }
  }

  // ===== 航路障碍小浮岛：随机刷在航线上，逼近需躲避 =====
  if (state.running && !levelOver && t > nextHazard) {
    const tpl = hazardTemplates[Math.floor(Math.random() * hazardTemplates.length)];
    const hz = tpl.clone();
    hz.position.set((Math.random() - 0.5) * 36, 6 + Math.random() * 13.5, -(120 + Math.random() * 50));
    hz.scale.setScalar(0.01);
    scene.add(hz); hazards.push(hz);
    nextHazard = t + 6500 + Math.random() * 3000;
  }
  for (const hz of [...hazards]) {
    hz.position.z += (12 * throttle * 0.9 + 5) * 1.5 * dt;   // 远处生成、略提速，抵达节奏不变
    hz.scale.setScalar(Math.min(1, hz.scale.x + dt * 0.9));
    hz.rotation.y += dt * 0.15;
    for (const ch of hz.children) {
      if (ch.isSprite) ch.material.opacity = 0.45 + Math.sin(t * 0.008) * 0.35;
    }
    if (hz.position.z > 10) { scene.remove(hz); hazards.splice(hazards.indexOf(hz), 1); continue; }
    if (state.running && performance.now() > invincT && plane.position.distanceTo(hz.position) < (hz.userData.size || 4) * 1.15 + 1.4) {
      scene.remove(hz); hazards.splice(hazards.indexOf(hz), 1);
      instantDeath();
    }
  }

  // ===== 碰撞：飞机撞上暗影精灵 → 损一命，精灵湮灭，短暂无敌 =====
  if (state.running && !levelOver && performance.now() > invincT) {
    for (const e of [...enemies]) {
      if (plane.position.distanceTo(e.position) < 1.5 + e.userData.spec.size * 0.4) {
        hitEnemy(e, 999);
        loseLife();
        break;
      }
    }
  }
  {
    const inv = performance.now() < invincT;
    plane.visible = state.running && (!inv || Math.floor(performance.now() / 130) % 2 === 0);
  }
  // 魔法战机动态：核心脉冲 / 悬浮石公转 / 双层尾焰抖动
  {
    const mt = performance.now();
    const pulse = 1 + Math.sin(mt * 0.004) * 0.12;
    for (const c of magicCores) c.scale.setScalar(pulse);
    for (const st of magicStones) {
      const ang = mt * 0.0014 + st.userData.k * Math.PI * 2 / 3;
      st.position.set(Math.cos(ang) * 0.58, Math.sin(ang) * 0.58, Math.sin(mt * 0.002 + st.userData.k) * 0.05);
      st.rotation.x = mt * 0.0012 + st.userData.k;
      st.rotation.y = mt * 0.0009;
    }
    const f = 1 + Math.sin(mt * 0.017) * 0.18;
    magicFlames[0].scale.z = f;
    magicFlames[1].scale.z = 0.8 + f * 0.3;
  }

  // ===== 弹药更新 =====
  for (const b of [...bullets]) {
    if (b.userData.homing && b.userData.target && enemies.includes(b.userData.target)) {
      b.userData.dir.copy(b.userData.target.position).sub(b.position).normalize();
      b.quaternion.setFromUnitVectors(Y_POS, b.userData.dir);
    }
    const px = b.position.x, py = b.position.y, pz = b.position.z;
    b.position.addScaledVector(b.userData.dir, 55 * dt);
    if (b.position.distanceTo(plane.position) > 120) { scene.remove(b); bullets.splice(bullets.indexOf(b), 1); continue; }
    _v1.set(b.position.x - px, b.position.y - py, b.position.z - pz);
    const segLenSq = Math.max(_v1.lengthSq(), 1e-6);
    for (const e of enemies) {
      _v2.set(e.position.x - px, e.position.y - py, e.position.z - pz);
      const tt = THREE.MathUtils.clamp(_v2.dot(_v1) / segLenSq, 0, 1);
      _v3.copy(_v1).multiplyScalar(tt);
      const dx = _v2.x - _v3.x, dy = _v2.y - _v3.y, dz = _v2.z - _v3.z;
      const rHit = 1.0 + e.userData.spec.size * 0.45;
      if (dx * dx + dy * dy + dz * dz < rHit * rHit) {
        hitEnemy(e, 1);
        scene.remove(b); bullets.splice(bullets.indexOf(b), 1);
        break;
      }
    }
  }
  for (const r of [...rockets]) {
    const px = r.position.x, py = r.position.y, pz = r.position.z;
    r.position.addScaledVector(r.userData.dir, 60 * dt);
    if (r.position.distanceTo(plane.position) > 150) { scene.remove(r); rockets.splice(rockets.indexOf(r), 1); continue; }
    _v1.set(r.position.x - px, r.position.y - py, r.position.z - pz);
    const segLenSq = Math.max(_v1.lengthSq(), 1e-6);
    for (const e of enemies) {
      _v2.set(e.position.x - px, e.position.y - py, e.position.z - pz);
      const tt = THREE.MathUtils.clamp(_v2.dot(_v1) / segLenSq, 0, 1);
      _v3.copy(_v1).multiplyScalar(tt);
      const dx = _v2.x - _v3.x, dy = _v2.y - _v3.y, dz = _v2.z - _v3.z;
      const rHit = 1.5 + e.userData.spec.size * 0.5;
      if (dx * dx + dy * dy + dz * dz < rHit * rHit) {
        hitEnemy(e, 3);
        scene.remove(r); rockets.splice(rockets.indexOf(r), 1);
        break;
      }
    }
  }
  for (const m of [...missiles]) {
    const tg = m.userData.target;
    if (tg && enemies.includes(tg)) {
      m.userData.dir.copy(tg.position).sub(m.position).normalize();
    }
    m.position.addScaledVector(m.userData.dir, 26 * dt);
    if (m.position.distanceTo(plane.position) > 150) { scene.remove(m); missiles.splice(missiles.indexOf(m), 1); continue; }
    for (const e of enemies) {
      if (m.position.distanceTo(e.position) < 1.3 + e.userData.spec.size * 0.3) {
        hitEnemy(e, 5);
        scene.remove(m); missiles.splice(missiles.indexOf(m), 1);
        break;
      }
    }
  }
  for (const d of [...deaths]) {
    d.t += dt;
    if (d.t > 0.15) { scene.remove(d.m); deaths.splice(deaths.indexOf(d), 1); continue; }
    d.m.scale.multiplyScalar(0.88);
  }

  renderer.render(scene, camera3);
}
requestAnimationFrame(loop);

function drawSkeleton() {
  const w = pip.width, h = pip.height;
  for (const { label, lm } of state.frameHands) {
    const color = label === "Left" ? "#7bdcff" : "#ffb35c";
    const P = j => ({ x: lm[j].x * w, y: lm[j].y * h });
    const p5 = P(5), p17 = P(17);
    pctx.strokeStyle = "rgba(255,255,255,.85)"; pctx.lineWidth = 3.5;
    pctx.beginPath(); pctx.moveTo(p5.x, p5.y); pctx.lineTo(p17.x, p17.y); pctx.stroke();
    pctx.strokeStyle = color; pctx.lineWidth = 2;
    pctx.beginPath();
    for (const [a, b] of HAND_CONNECTIONS) { const pa = P(a), pb = P(b); pctx.moveTo(pa.x, pa.y); pctx.lineTo(pb.x, pb.y); }
    pctx.stroke();
    pctx.fillStyle = color;
    for (let j = 0; j < lm.length; j++) { const p = P(j); pctx.beginPath(); pctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); pctx.fill(); }
    const w0 = P(0);
    pctx.font = "bold 16px Consolas";
    pctx.fillText(label === "Left" ? "左手" : "右手", w0.x - 18, w0.y + 28);
  }
}
</script>
